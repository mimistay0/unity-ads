<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSEngDz Full Ads</title>
    <!-- استدعاء مكتبة يونيتي الرسمية للويب -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000000; display: flex; justify-content: center; align-items: center; overflow: hidden; width: 100vw; height: 100vh; }
        #ad-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="ad-container"></div>

    <script>
        // خداع السيرفرات ليتصرف كأنه تطبيق أندرويد حقيقي قادم من هاتف ذكي لحماية الحساب
        Object.defineProperty(navigator, 'userAgent', {
            get: function () { return 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36'; }
        });

        // بيانات حسابك الحقيقي للإعلان البيني الكامل
        const GAME_ID = "800412004"; 
        const PLACEMENT_ID = "BP_Interstitial_Android"; 
        const IS_TEST_MODE = false; // إعلانات حقيقية ومربحة فوراً

        UnityAds.init({
            gameId: GAME_ID,
            testMode: IS_TEST_MODE,
            onStart: () => {
                // بث إعلان فيديو كامل يغطي الشاشة تلقائياً عند فتح الصفحة
                UnityAds.show(PLACEMENT_ID, {
                    container: document.getElementById('ad-container'),
                    onComplete: () => console.log('Ad Closed By User'),
                    onError: (error) => console.error('Playback Error:', error)
                });
            },
            onError: (error) => console.error('Unity Init Error:', error)
        });
    </script>
</body>
</html>
